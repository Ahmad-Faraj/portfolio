# Builds the one shipped version and publishes it to GitHub Pages at
# https://ahmad-faraj.github.io/portfolio/, the URL printed on the CV.
#
# There are no dependencies, so there is nothing to install and no lockfile to
# restore: `npm run ship v2` is `node build.mjs --clean --flat --only v2`, which
# writes dist/index.html plus its assets, ready to serve as-is.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build
        run: npm run ship v2

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
